[pytest]
# Running `pytest` from the repository root is the obvious first thing anyone
# does, and without this file it was quietly wrong in two ways.
#
# asyncio_mode: the per-package config under apps/api is only read when pytest
# is pointed at that directory. A plain root run left the mode unset and
# reported all seventeen async tests as failures. They were not failing.
#
# pythonpath: the agronomy and geo packages are not installed, only placed on
# the path. Until now that happened by accident -- importing agrin_api inserts
# them as a side effect, and apps/ sorts before packages/, so the agronomy
# tests imported cleanly only because something else had already run. Stating
# the source roots here makes the suite independent of collection order.
asyncio_mode = auto

pythonpath =
    packages/agronomy
    packages/geo
    apps/api

testpaths =
    packages/agronomy/tests
    packages/geo/tests
    apps/api/tests
    federation

markers =
    local_map: exercises the local India soil map rather than the network path
