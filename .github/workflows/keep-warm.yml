# Keep the Render deployment awake.
#
# Render's free plan suspends a service after 15 minutes without a request,
# and the next visitor waits about 50 seconds while the container is rebuilt
# and the advisory index is loaded back into memory. That is the single
# largest latency in the whole system -- larger than the model call, larger
# than any data lookup -- and it lands on exactly the person least likely to
# wait for it: someone opening the link for the first time.
#
# A request every ten minutes keeps the service resident. GitHub Actions is
# free without limit on public repositories, so this costs nothing.
#
# Two things worth knowing before leaving it on permanently:
#
#   * Render's free plan allows 750 instance-hours a month and a month is
#     about 730 hours, so one service kept awake continuously uses nearly the
#     whole allowance. One service is fine; two are not.
#   * GitHub disables scheduled workflows on a repository with no commits for
#     60 days, silently. If the service starts sleeping again months from
#     now, look here first.
#
# `workflow_dispatch` is here so the service can be woken deliberately before
# a demonstration rather than waiting on the schedule.

name: keep-warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Overlapping runs would be pointless, and a queued backlog of them worse.
concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the service
        run: |
          # --max-time generously exceeds a cold start; a failure here means
          # the service is down, not merely asleep, which is worth seeing in
          # the Actions log rather than swallowing.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
                   --max-time 120 --retry 2 --retry-delay 10 \
                   https://saathi-cwm2.onrender.com/api/health)
          echo "health returned $code"
          test "$code" = "200"
