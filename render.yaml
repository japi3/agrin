# Render Blueprint — deploys the real app, the React PWA served by FastAPI
# out of the single existing container.
#
# The free plan gives 512 MB, which is ten times what this service uses: it
# runs at 57 MB with the whole advisory index resident. What free costs
# instead is latency after idle — Render suspends a free service after 15
# minutes and the next request waits about 50 seconds while it wakes. For a
# link a judge opens once that is a fair trade; for a farmer it would not be.
#
# The keys are deliberately not in this file. sync: false means Render asks
# for each one in the dashboard when the blueprint is applied, so nothing
# secret is ever committed.

services:
  - type: web
    name: saathi
    runtime: docker
    plan: free
    region: singapore          # nearest region to Indian users
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEYS
        sync: false
      - key: DATA_GOV_IN_KEY
        sync: false
      # Both are plain values rather than dashboard secrets, deliberately.
      # They were dashboard-managed, and what the dashboard held had rotted:
      # gemini-3.7-flash as the default and gemini-3.8-flash heading the
      # chain, both withdrawn upstream and both costing a 45-second timeout
      # on every request before a live model was reached. Nothing in the repo
      # showed it. Kept here, the configuration is reviewable and a stale
      # model name is a diff rather than a discovery.
      #
      # Verify with scripts/probe_models.py before a demonstration. Model
      # names expire; this list was measured on 2026-10-26.
      - key: AGRIN_MODEL
        value: gemini-3.6-flash
      - key: AGRIN_MODEL_FALLBACKS
        value: gemini-3.5-flash,gemini-3-flash-preview,gemini-3.5-flash-lite
      - key: AGRIN_CORS_ORIGINS
        value: "*"
